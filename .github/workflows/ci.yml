name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m runbookops.evaluate
      - run: python -m runbookops.benchmark --split validation
      - run: python -m runbookops.answerability --split validation
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
