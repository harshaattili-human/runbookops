name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m runbookops.evaluate
      - run: python -m runbookops.benchmark --split validation
      - run: python -m runbookops.answerability --split validation
      - run: python -m runbookops.passage_answerability --split validation
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build the packaged application
        run: docker build --pull --tag runbookops:smoke .
      - name: Check the image over HTTP
        run: python scripts/container_smoke.py
      - name: Audit installed OS and Python packages
        run: bash scripts/audit_image.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: image-audit
          path: reports/security/
          retention-days: 30
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e .
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:browser
        working-directory: frontend
      - name: Export the recorded demo
        run: python scripts/export_demo.py artifacts/RunbookOps-Demo.html
      - name: Diagnose WebKit local-file navigation
        run: node file-navigation-probe.mjs
        working-directory: frontend
      - run: npm run test:replay
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        with:
          name: recorded-demo
          path: artifacts/
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: recorded-demo-browser-report
          path: frontend/playwright-replay-report/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-report
          path: frontend/playwright-report/
          retention-days: 14
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high --json > npm-audit.json
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: npm-audit
          path: frontend/npm-audit.json
          retention-days: 30
