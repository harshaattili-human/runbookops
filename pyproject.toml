[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "runbookops"
version = "0.1.0"
description = "Evidence-linked incident triage with reproducible ML evaluation"
requires-python = ">=3.11"
dependencies = ["fastapi==0.142.2", "uvicorn==0.54.0", "scikit-learn==1.8.0", "numpy==2.3.5", "httpx==0.28.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
